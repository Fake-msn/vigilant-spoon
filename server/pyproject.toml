[project]
name = "xiaoxing-server"
version = "0.1.0"
description = "小信后端服务：FastAPI + AgentScope + SQLite"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tenacity>=8.4",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "agentscope>=1.0.0",
    "mcp>=1.13,<2.0",
    "websockets>=14.0,<16.0",
    "openai>=1.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "scripts/_*.py",
    "scripts/spike_*.py",
    "scripts/smoke_*.py",
    "scripts/acceptance*.py",
    "scripts/rehearsal.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]

[tool.ruff.lint.per-file-ignores]
"app/deps.py" = ["B008"]
"app/routers/classroom.py" = ["B008"]
"app/routers/growth.py" = ["B008"]
"app/routers/classes.py" = ["B008"]
"app/routers/jobs.py" = ["B008"]
"app/routers/letters.py" = ["B008"]
"app/routers/lesson.py" = ["B008"]
"app/routers/academic.py" = ["B008"]
"app/routers/session.py" = ["B008"]
"app/routers/points.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
